# За внешним прокси с HTTPS сохраняем его схему: из неё бэкенд строит абсолютные ссылки.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream backend {
    server backend:8000;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/sport-tiles levels=1:2 keys_zone=sport_tiles:10m
    max_size=100m inactive=7d;

server {
    listen 80;
    server_name _;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml
        text/xml application/manifest+json application/ld+json;

    proxy_http_version 1.1;
    # Пустой Connection включает keepalive к бэкенду и не даёт nginx закрывать поток.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Живые обновления (SSE): без буферизации и сжатия, соединение держится долго.
    # Бэкенд шлёт комментарий-heartbeat каждые 15 секунд, поэтому таймаут чтения с запасом.
    location = /api/stream {
        # Токен вкладки приходит параметром адреса (EventSource не умеет заголовки) — не пишем его в журнал.
        access_log off;
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Мост чат-бота на компьютере (bridge/): WebSocket, соединение держится часами, пинг раз в 20 секунд.
    location = /api/assistant/bridge {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Ответ модели ждём дольше обычного запроса: таймаут помощника в админке до 120 секунд.
    # Точные адреса: префикс ^~ /api/ ниже отключает проверку регулярных выражений.
    location = /api/assistant/chat {
        proxy_pass http://backend;
        proxy_read_timeout 150s;
    }
    location = /api/admin/assistant/test {
        proxy_pass http://backend;
        proxy_read_timeout 150s;
    }
    # Обложку рисует Codex на компьютере через мост: до трёх минут, ответ — PNG в base64 (2–3 МБ).
    location = /api/assistant/cover {
        proxy_pass http://backend;
        proxy_read_timeout 180s;
    }

    # ^~: адреса API не попадают в правило кэша картинок ниже, даже если оканчиваются на .png.
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    # Точка протокола MCP для внешних ассистентов (Authorization: Bearer — личный токен).
    location = /mcp {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    # Поставщик тайлов не отдаёт CORS-заголовки. Координаты — единственные параметры
    # прокси; адрес сервера фиксирован. Cookies и токены сайта наружу не передаются.
    location ~ "^/map-tiles/([0-9]{1,2})/([0-9]{1,7})/([0-9]{1,7})\.mvt$" {
        resolver 127.0.0.11 valid=300s;
        set $tile_host glpm.rcfh.ru;
        proxy_pass https://$tile_host/api/tiles/$1/$2/$3.mvt;
        proxy_ssl_server_name on;
        proxy_ssl_name glpm.rcfh.ru;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host glpm.rcfh.ru;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Sport-i-tochka/1.0 (+https://sport.up-point.tech)";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache sport_tiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    # Временный просмотр календаря завершён: события доступны в основной ленте.
    location ^~ /calendar-2027-2031/ {
        return 410;
    }

    # Файлы сборки Vite с хешем в имени можно кэшировать навсегда.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Файлы из корня public (иконки, картинка превью ссылок, манифест): имена без хеша — неделя.
    location ~* \.(png|jpg|jpeg|webp|ico|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
    }

    # В mime.types образа nginx нет .webmanifest: без этого манифест ушёл бы как octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        try_files $uri =404;
    }

    location = /robots.txt {
        proxy_pass http://backend/api/robots.txt;
        proxy_read_timeout 10s;
    }

    # Карта сайта собирается на бэкенде из открытых событий, организаций и площадок.
    location = /sitemap.xml {
        proxy_pass http://backend/api/seo/sitemap.xml;
        proxy_read_timeout 30s;
    }

    # Маршруты SPA отдаёт index.html; сам index.html не кэшируем, чтобы обновления доходили сразу.
    # SSI вставляет в index.html заголовок, описание, Open Graph и краткое содержание страницы
    # (/api/seo/head и /api/seo/body): поисковики и превью ссылок видят страницу без JavaScript.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        ssi on;
        ssi_last_modified off;
        # Без $uri/: каталог public/demo совпал бы с маршрутом /demo и дал бы 403.
        try_files $uri /index.html;
    }
}
