# Подключается в HTTPS server внешнего nginx. Адрес клиента берётся из TCP-соединения,
# поэтому подмена X-Forwarded-For не обходит ограничение.
location ~ ^/api/auth/(login|demo-login|register|verify-email|resend-verification|password/(forgot|reset)|phone/(send|verify))$ {
    limit_req zone=sport_auth burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @sport_auth_throttled;
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @sport_auth_throttled {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"code":"rate_limited","statusCode":429,"message":"Слишком много попыток. Подождите минуту и попробуйте снова.","retryAfter":60}';
}
